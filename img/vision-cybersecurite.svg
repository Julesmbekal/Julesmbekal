<svg viewBox="0 0 640 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#C89B4C"/>
    </marker>
  </defs>

  <!-- connecting spine -->
  <line x1="320" y1="128" x2="320" y2="196" stroke="#C89B4C" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="320" y1="332" x2="320" y2="400" stroke="#C89B4C" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- LAYER 1 — STRATEGIE / BUSINESS -->
  <g>
    <rect x="140" y="24" width="360" height="104" rx="6" fill="#16202E" stroke="#2E3E52" stroke-width="1"/>
    <rect x="140" y="24" width="6" height="104" fill="#C89B4C"/>

    <!-- briefcase icon -->
    <g transform="translate(172,54)" stroke="#C89B4C" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <rect x="0" y="8" width="28" height="20" rx="2"/>
      <path d="M8,8 V4 a2,2 0 0 1 2,-2 h8 a2,2 0 0 1 2,2 v4"/>
      <line x1="0" y1="18" x2="28" y2="18"/>
    </g>

    <text x="222" y="66" fill="#F4F1EA" font-size="19" font-weight="600" letter-spacing="0.5">Stratégie business</text>
    <text x="222" y="90" fill="#9AA7B8" font-size="13">Impact métier · Objectifs · Priorités</text>
  </g>

  <!-- LAYER 2 — RISQUES / GRC -->
  <g>
    <rect x="90" y="196" width="460" height="136" rx="6" fill="#182335" stroke="#2E3E52" stroke-width="1"/>
    <rect x="90" y="196" width="6" height="136" fill="#C89B4C"/>

    <!-- shield icon -->
    <g transform="translate(122,240)" stroke="#C89B4C" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M14,0 L28,6 V16 C28,26 21,31 14,34 C7,31 0,26 0,16 V6 Z"/>
      <path d="M7,17 L12,22 L21,11" stroke-width="2.2"/>
    </g>

    <text x="172" y="238" fill="#F4F1EA" font-size="19" font-weight="600" letter-spacing="0.5">Gouvernance des risques</text>
    <text x="172" y="262" fill="#9AA7B8" font-size="13">Menaces · Contrôles · Conformité</text>
    <text x="172" y="282" fill="#9AA7B8" font-size="13">EBIOS RM · ISO 27001/27002 · GRC</text>
  </g>

  <!-- LAYER 3 — TECHNOLOGIE -->
  <g>
    <rect x="40" y="400" width="560" height="136" rx="6" fill="#1A2740" stroke="#2E3E52" stroke-width="1"/>
    <rect x="40" y="400" width="6" height="136" fill="#C89B4C"/>

    <!-- server / network icon -->
    <g transform="translate(72,432)" stroke="#C89B4C" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <rect x="0" y="0" width="30" height="12" rx="2"/>
      <rect x="0" y="16" width="30" height="12" rx="2"/>
      <rect x="0" y="32" width="30" height="12" rx="2"/>
      <circle cx="6" cy="6" r="1.4" fill="#C89B4C" stroke="none"/>
      <circle cx="6" cy="22" r="1.4" fill="#C89B4C" stroke="none"/>
      <circle cx="6" cy="38" r="1.4" fill="#C89B4C" stroke="none"/>
    </g>

    <text x="130" y="446" fill="#F4F1EA" font-size="19" font-weight="600" letter-spacing="0.5">Infrastructure technique</text>
    <text x="130" y="470" fill="#9AA7B8" font-size="13">Réseaux · Systèmes · Active Directory</text>
    <text x="130" y="490" fill="#9AA7B8" font-size="13">Sécurité opérationnelle · SOC · Hardening</text>
  </g>

  <!-- bottom line -->
  <text x="320" y="552" fill="#6B7A8F" font-size="12.5" text-anchor="middle">Comprendre la technique · Identifier le risque · Communiquer l'impact métier</text>

</svg>
